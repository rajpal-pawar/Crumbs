[package]
name            = "crumbs-daemon"
version         = "0.1.0"
edition         = "2021"
description     = "Crumbs offline semantic-search daemon"

[[bin]]
name = "crumbs-daemon"
path = "src/main.rs"

[dependencies]
# PDF extraction
pdfium-render = "0.8"
ocrs = "0.9.0"
rten = "=0.13.1"
rten-imageproc = "=0.13.1"
rten-tensor = "=0.13.1"
# Core dependencies
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync", "time", "fs"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
rusqlite    = { version = "0.31", features = ["bundled"] }
sqlite-vec  = "0.1"
zerocopy    = { version = "0.7", features = ["derive"] }
ort         = { version = "2.0.0-rc.12", features = ["download-binaries", "ndarray"] }
ndarray     = "0.17"
tokenizers  = { version = "0.19", default-features = false, features = ["onig"] }
notify      = { version = "6", features = ["serde"] }
uuid        = { version = "1", features = ["v4"] }
thiserror   = "1"
walkdir     = "2"
sha2        = "0.10"
hex         = "0.4"
mime_guess  = "2"
image       = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
dirs        = "5"
tokio-util  = { version = "0.7", features = ["codec"] }
futures     = "0.3"
reqwest     = { version = "0.11", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
zip         = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
